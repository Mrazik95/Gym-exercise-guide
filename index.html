<style>
  :root{
    --bg:#111418; --panel:#1a1f25; --panel2:#222830; --line:#2c333c;
    --text:#e9edf1; --muted:#9aa4af; --accent:#c8f169; --accent-ink:#111418;
    --warn:#ffb86b; --radius:14px;
  }
  *{box-sizing:border-box;min-width:0}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    -webkit-tap-highlight-color:transparent;overflow-x:clip}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  a{color:var(--accent)}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
    padding:calc(14px + env(safe-area-inset-top)) 0 10px}
  .title{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .title h1{font-size:22px;margin:0;letter-spacing:-.01em;flex:1}
  .title .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
  .lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .lang button{padding:6px 11px;font-size:13px;font-weight:700;color:var(--muted);min-height:34px}
  .lang button.on{background:var(--accent);color:var(--accent-ink)}
  .search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:16px;outline:none}
  .search:focus{border-color:var(--accent)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);font-size:14px;white-space:nowrap}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;
    padding:14px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line)}
  .card:active{background:var(--panel2)}
  .card .main{flex:1;min-width:0}
  .card .name{font-weight:600}
  .card .sub{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{flex:none;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--muted)}
  .badge.ok{color:var(--accent)}
  .abbr{flex:none;min-width:64px;max-width:40%;font-weight:700;color:var(--accent);font-size:15px}
  .star{flex:none;font-size:20px;color:var(--muted);padding:6px 4px;min-width:44px;min-height:44px}
  .star.on{color:var(--accent)}
  .bar-r{display:flex;align-items:center;gap:4px}
  .share{font-weight:600;color:var(--text);padding:8px 12px;min-height:40px;border-radius:10px;background:var(--panel2);font-size:14px}
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
    background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;border-radius:12px;max-width:90vw;
    overflow-wrap:anywhere;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1;pointer-events:auto}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;
    background:rgba(17,20,24,.96);border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
  nav.tabs .in{display:flex;gap:6px;width:100%;max-width:720px}
  nav.tabs button{flex:1;padding:10px 4px;border-radius:12px;color:var(--muted);font-size:14px;font-weight:600;min-height:44px}
  nav.tabs button.on{background:var(--panel2);color:var(--accent)}
  .detail{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
    transform:translateX(100%);transition:transform .22s ease;visibility:hidden}
  .detail.open{transform:none;visibility:visible}
  @media (prefers-reduced-motion:reduce){.detail{transition:none}}
  .detail .bar{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;z-index:2;
    background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 6px;border-bottom:1px solid var(--line)}
  .back{font-weight:600;color:var(--accent);padding:8px 4px;min-height:44px}
  .detail .body{max-width:720px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
  .detail h2{font-size:26px;margin:0 0 6px;letter-spacing:-.01em;line-height:1.15}
  .alt{color:var(--muted);font-size:14px;margin:0 0 6px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
  .lead{color:#cfd6dd;margin:0 0 18px}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 12px}
  .sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
  .sec ol,.sec ul{margin:0;padding-left:20px}
  .sec li{margin:4px 0}
  .sec.warn h3{color:var(--warn)}
  .sec.src li{font-size:14px;overflow-wrap:anywhere}
  .video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;min-height:48px;
    background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
  .btn.ghost{background:var(--panel2);color:var(--text);margin-top:8px}
  .example{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--panel2);
    padding:10px 12px;border-radius:10px;white-space:pre-wrap}
  .related{display:flex;flex-wrap:wrap;gap:8px}
  .related button{padding:8px 12px;border-radius:999px;background:var(--panel2);font-size:14px;min-height:40px}
  .about p{color:#cfd6dd;margin:0 0 10px}
  .note{font-size:13px;color:var(--muted)}
</style>
</head>

  cs:{name:"Mrtvý tah (klasický)",muscles:"Hýždě, hamstringy, vzpřimovače, trapézy, úchop",

 {id:"rdl",cat:"legs",equip:"bbdb",level:0,src:["nscaRDL","nasmRDL"],

  cs:{name:"Rumunský mrtvý tah (RDL)",muscles:"Hamstringy, hýždě, vzpřimovače",

 {id:"lunge",cat:"legs",equip:"bwdb",level:0,

 {id:"bulgarian",cat:"legs",equip:"benchdb",level:1,src:["ltBSS"],
  en:{name:"Bulgarian Split Squat",muscles:"Quads, glutes, adductors",
   about:"A split squat with the rear foot elevated on a bench. A very effective single-leg strength builder.",

 {id:"hip-thrust",cat:"legs",equip:"bbbench",level:0,src:["hkHip","bcHip"],

  cs:{name:"Hip thrust",muscles:"Hýždě, hamstringy",
   about:"Horní záda opřená o lavičku, propínáš kyčle a zvedáš osu ležící přes boky. Cílený cvik na hýždě.",
   steps:["Sedni si tak, aby se lavičky dotýkala spodní část lopatek, osa přes kyčelní ohyb (použij návlek).","Chodidla na zemi zhruba na šířku boků, tak aby holeně byly nahoře svisle.","Mírně stáhni bradu a vytlač boky nahoru, až trup a stehna tvoří rovnou linii.","Chvíli zatni hýždě a pak kontrolovaně spouštěj."],

 {id:"leg-press",cat:"legs",equip:"machine",level:0,

  cs:{name:"Legpress",muscles:"Kvadricepsy, hýždě",

 {id:"calf-raise",cat:"legs",equip:"machstep",level:0,

 {id:"bench",cat:"push",equip:"barbell",level:1,src:["joiBench"],
  en:{name:"Bench Press",muscles:"Chest, front delts, triceps",
   about:"Lying on a flat bench, lower a barbell to the chest and press it back up. The main upper-body pushing strength lift.",
   steps:["Lie with eyes under the bar, feet flat on the floor.","Grip slightly wider than shoulder width. Pull the shoulder blades back and down.","Unrack with straight arms over the shoulders.","Lower the bar to the lower chest / sternum with elbows roughly 45–70° from the body (depends on grip width).","Press up and slightly back toward the rack position."],
   cues:["Shoulder blades pinned","Forearms vertical","Feet drive into the floor"],

  cs:{name:"Bench press (tlak na lavici)",muscles:"Prsa, přední delty, tricepsy",
   about:"Vleže na rovné lavici spouštíš osu k hrudníku a tlačíš ji zpět. Hlavní silový tlakový cvik pro horní polovinu těla.",
   steps:["Lehni si tak, aby oči byly pod osou, chodidla celou plochou na zemi.","Úchop o kousek širší než ramena. Stáhni lopatky dozadu a dolů.","Sundej osu s propnutými pažemi nad ramena.","Spouštěj osu ke spodní části hrudníku / hrudní kosti, lokty zhruba 45–70° od těla (podle šíře úchopu).","Vytlač nahoru a mírně zpět nad ramena."],
   cues:["Lopatky přišpendlené","Předloktí svisle","Nohy tlačí do země"],
   mistakes:["Lokty roztažené do 90°","Odrážení osy od hrudníku","Zvedání pánve z lavice","Těžké série bez dopomoci nebo bezpečnostních zarážek"]}},
 {id:"incline-db",cat:"push",equip:"dbbench",level:0,

   mistakes:["Bench too steep (becomes a shoulder press)","Dropping the dumbbells uncontrolled at the end"]},
  cs:{name:"Tlak s jednoručkami na šikmé lavici",muscles:"Horní část prsou, přední delty, tricepsy",

 {id:"ohp",cat:"push",equip:"barbell",level:1,src:["hkOHP"],
  en:{name:"Overhead Press",muscles:"Shoulders, triceps, upper chest, core",

  cs:{name:"Tlak nad hlavu (military press)",muscles:"Ramena, tricepsy, horní část prsou, střed těla",
   about:"Striktní tlak osy ve stoje z ramen nad hlavu.",
   steps:["Osa na předních ramenech, úchop kousek vně ramen, předloktí svisle.","Zatni hýždě a zpevni trup, ať se neprohýbají bedra.","Tlač osu přímo nahoru a hlavu dej mírně dozadu, ať ji osa mine.","Jakmile osa mine čelo, prostrč hlavu „oknem“ dopředu, aby osa skončila nad rameny a středem chodidel."],

   mistakes:["Záklon, ze kterého je tlak na šikmé lavici","Osa končí před hlavou","Pokrčení kolen pro švih (to už je push press)"]}},

 {id:"lateral-raise",cat:"push",equip:"db",level:0,

   mistakes:["Kulacení zad, abys dosáhl na kettlebell","Dřepování místo předklonu v kyčlích"]}},
 {id:"kb-swing-1h",cat:"cond",equip:"kb",level:1,kb:true,src:["sfHinge"],
  en:{name:"One-Arm Kettlebell Swing",muscles:"Glutes, hamstrings, core, grip, shoulder stability",
   about:"The swing with one hand. The body must also resist rotating, and it's the base for the clean and the snatch.",
   steps:["Set up like the two-hand swing, gripping the handle with one hand.","Hike the bell back high between the legs.","Snap the hips forward; the bell floats to about chest height.","Keep the shoulders square — don't let the bell twist you."],
   cues:["Same hinge as the two-hand swing","Free arm can mirror the working arm"],
   mistakes:["Rotating the torso with the bell","Shoulder pulled forward out of its socket at the top"]},
  cs:{name:"Jednoruční swing",muscles:"Hýždě, hamstringy, střed těla, úchop, stabilita ramene",
   about:"Swing jednou rukou. Tělo se navíc musí bránit vytočení a je to základ pro přemístění i trh.",
   steps:["Postav se jako u obouručního swingu, madlo drž jednou rukou.","Podej kettlebell vysoko dozadu mezi nohy.","Prudce propni boky; kettlebell vyletí zhruba do výšky hrudníku.","Ramena drž rovně — nenech se kettlebellem vytočit."],
   cues:["Stejný předklon v kyčlích jako u obouručního swingu","Volná ruka může kopírovat pracující"],
   mistakes:["Rotace trupu s kettlebellem","Rameno vytažené nahoře dopředu"]}},
 {id:"kb-clean",cat:"cond",equip:"kb",level:1,kb:true,src:["hkKB","ltClean","kwClean"],
  en:{name:"Kettlebell Clean",muscles:"Glutes, hamstrings, upper back, grip",
   about:"Bringing the kettlebell from between the legs to the rack position at the chest in one hip-driven movement. It's how you get the bell into position for presses, jerks and front squats.",
   steps:["Start like a one-arm swing: hike the bell back between the legs.","Drive the hips forward, but keep the bell close to the body — it travels up, not out in an arc.","As it rises, slide the hand around and through the handle early, so the bell rolls around the wrist instead of flipping over it.","Finish in the rack: wrist neutral, elbow close to the ribs, bell resting softly against the forearm and upper arm, torso tall.","To repeat, drop the bell back into the backswing and hinge."],
   cues:["It's a swing that ends in the rack","Hips power it, the arm only guides it","Around the hand, not over it"],
   mistakes:["Bell banging on the forearm (usually late hand insertion or a wide arc)","Curling it up with the biceps","Wrist bent back in the rack","Leaning back to hold the bell"]},
  cs:{name:"Přemístění kettlebellu (clean)",muscles:"Hýždě, hamstringy, horní záda, úchop",
   about:"Přenesení kettlebellu mezi nohama do pozice u hrudníku (rack) jedním pohybem z boků. Takhle se kettlebell dostane do pozice pro tlaky, jerky a čelní dřepy.",
   steps:["Začni jako jednoruční swing: podej kettlebell dozadu mezi nohy.","Vytlač boky dopředu, ale kettlebell drž blízko těla — jde nahoru, ne v oblouku ven.","Jak stoupá, včas zasuň ruku kolem a skrz madlo, aby se kettlebell převalil kolem zápěstí a nepřepadl přes něj.","Skonči v racku: zápěstí rovné, loket u žeber, kettlebell měkce opřený o předloktí a paži, trup vzpřímený.","Při opakování nech kettlebell spadnout zpět do zášvihu a předkloň se v kyčlích."],
   cues:["Je to swing, který končí v racku","Pohon z boků, ruka jen vede","Kolem ruky, ne přes ni"],
   mistakes:["Kettlebell tluče do předloktí (obvykle pozdní zasunutí ruky nebo široký oblouk)","Zvedání bicepsem","Zalomené zápěstí v racku","Záklon, abys kettlebell udržel"]}},
 {id:"squat-clean-kb",cat:"cond",equip:"kb",level:1,kb:true,
  en:{name:"Kettlebell Squat Clean",muscles:"Legs, glutes, upper back, core",
   about:"A kettlebell clean followed straight by a front squat with the bell in the rack. Gyms use the name a little differently — some mean receiving the clean directly in a squat — so check what your coach means.",
   steps:["Clean the kettlebell into the rack position.","Without pausing, squat down with the bell held in the rack, elbow tucked.","Stand up, then drop the bell into the next backswing."],
   cues:["Own the rack before you squat","Chest up in the squat"],
   mistakes:["Squatting before the bell has settled in the rack","Elbow flaring out so the bell pulls you forward"]},
  cs:{name:"Přemístění do dřepu (squat clean)",muscles:"Nohy, hýždě, horní záda, střed těla",
   about:"Přemístění kettlebellu hned následované čelním dřepem s kettlebellem v racku. Posilovny ten název používají trochu různě — někdy znamená chycení přemístění přímo v dřepu — tak si ověř, co tím myslí tvůj trenér.",
   steps:["Přemísti kettlebell do racku.","Bez pauzy jdi do dřepu s kettlebellem v racku, loket u těla.","Vstaň a pak nech kettlebell spadnout do dalšího zášvihu."],
   cues:["Nejdřív stabilní rack, pak dřep","V dřepu hrudník nahoru"],
   mistakes:["Dřep dřív, než se kettlebell usadí v racku","Loket ujíždí do strany a kettlebell tě táhne dopředu"]}},
 {id:"kb-press",cat:"push",equip:"kb",level:1,kb:true,
  en:{name:"Kettlebell Strict Press",muscles:"Shoulders, triceps, upper back, core",
   about:"Pressing a kettlebell from the rack to overhead without help from the legs. Usually done one arm at a time.",
   steps:["Clean the bell to the rack. Squeeze the glutes and brace.","Press the bell up, keeping the forearm vertical under it.","Finish with the arm locked, biceps near the ear, bell over the shoulder.","Lower under control back to the rack."],
   cues:["Whole body tight — legs, glutes, abs","Forearm stays vertical"],
   mistakes:["Leaning back or sideways","Bending the knees for drive (that's a push press)","Wrist bent back under the load"]},
  cs:{name:"Striktní tlak kettlebellu",muscles:"Ramena, tricepsy, horní záda, střed těla",
   about:"Tlak kettlebellu z racku nad hlavu bez pomoci nohou. Obvykle jednou rukou.",
   steps:["Přemísti kettlebell do racku. Zatni hýždě a zpevni trup.","Vytlač kettlebell nahoru, předloktí zůstává pod ním svisle.","Skonči se zamčenou paží, biceps u ucha, kettlebell nad ramenem.","Kontrolovaně spusť zpět do racku."],
   cues:["Celé tělo zpevněné — nohy, hýždě, břicho","Předloktí svisle"],
   mistakes:["Záklon nebo úklon","Pokrčení kolen pro švih (to je push press)","Zalomené zápěstí pod zátěží"]}},
 {id:"kb-push-press",cat:"push",equip:"kb",level:1,kb:true,
  en:{name:"Kettlebell Push Press",muscles:"Shoulders, triceps, legs, core",
   about:"A press helped by a short dip and drive from the legs. Lets you move more weight overhead than a strict press.",
   steps:["Bell in the rack, feet about hip width.","Dip a few centimetres by bending the knees, torso upright.","Drive up hard with the legs and use that momentum to press the bell overhead.","Lock out, then lower to the rack."],
   cues:["Short, fast dip — straight down","Legs start it, arms finish it"],
   mistakes:["Dip too deep or leaning forward in the dip","Pressing before the legs have finished driving"]},
  cs:{name:"Push press s kettlebellem",muscles:"Ramena, tricepsy, nohy, střed těla",
   about:"Tlak s pomocí krátkého podřepu a odrazu z nohou. Umožní dostat nad hlavu víc váhy než striktní tlak.",
   steps:["Kettlebell v racku, chodidla zhruba na šířku boků.","Podřepni o pár centimetrů pokrčením kolen, trup vzpřímený.","Prudce se odraz nohama a s využitím švihu vytlač kettlebell nad hlavu.","Zamkni paži a spusť zpět do racku."],
   cues:["Krátký, rychlý podřep — rovně dolů","Nohy začnou, ruce dokončí"],
   mistakes:["Moc hluboký podřep nebo předklon v podřepu","Tlak rukou dřív, než nohy dokončí odraz"]}},
 {id:"kb-jerk",cat:"push",equip:"kb",level:2,kb:true,src:["bmJerk","wikiGS"],
  en:{name:"Kettlebell Jerk",muscles:"Legs, shoulders, triceps, core",
   about:"A main kettlebell-sport lift: the bell goes from the rack to overhead using two knee dips. Unlike the push press, you drop under the bell in a second dip and then stand up with it locked out. Done with one or two bells.",
   steps:["Rack: elbows resting on or close to the hips, legs relaxed.","First dip: short, quick knee bend while the elbows stay connected to the body.","Bump: drive the legs explosively straight — the bell is launched by the legs, not the arms.","Second dip: as the arms lock out, drop quickly under the bell by bending the knees again.","Fixation: stand up straight with the arms locked and hold still for a moment.","Drop the bell back to the rack, absorbing it with the legs."],
   cues:["Arms are passive — legs do the work","Breathe on every phase; never hold your breath overhead"],
   mistakes:["Pressing out with the arms instead of dropping under","Skipping the full fixation at the top","Holding the breath during a long set"]},
  cs:{name:"Jerk (vzpor) s kettlebellem",muscles:"Nohy, ramena, tricepsy, střed těla",
   about:"Hlavní disciplína kettlebellového sportu: kettlebell jde z racku nad hlavu pomocí dvou podřepů. Na rozdíl od push pressu se ve druhém podřepu dostaneš pod kettlebell a pak se s ním postavíš se zamčenýma rukama. S jedním nebo dvěma kettlebelly.",
   steps:["Rack: lokty opřené o boky nebo těsně u nich, nohy uvolněné.","První podřep: krátké a rychlé pokrčení kolen, lokty zůstávají u těla.","Odraz: výbušně propni nohy — kettlebell vystřelí díky nohám, ne rukám.","Druhý podřep: ve chvíli, kdy se paže zamykají, rychle znovu podřepni pod kettlebell.","Fixace: postav se rovně se zamčenými pažemi a chvilku vydrž v klidu.","Spusť kettlebell zpět do racku a ztlum ho nohama."],
   cues:["Ruce jsou pasivní — práci dělají nohy","Dýchej v každé fázi; nad hlavou nikdy nezadržuj dech"],
   mistakes:["Dotlačování rukama místo podřepnutí","Vynechaná plná fixace nahoře","Zadržování dechu během dlouhé série"]}},
 {id:"long-cycle",cat:"cond",equip:"kb",level:2,kb:true,src:["wikiGS","eliteGS"],
  en:{name:"Long Cycle (Clean & Jerk)",muscles:"Whole body",
   about:"A clean followed by a jerk on every rep — one of the main kettlebell-sport events. In competition it's a 10-minute set for as many reps as possible without putting the bell down; with one bell, only one hand switch is allowed.",
   steps:["Clean the bell to the rack.","Jerk it overhead (first dip, bump, second dip, fixation).","Drop it back to the rack, then into the backswing.","Clean again and repeat — find a rhythm you can hold."],
   cues:["Pace it — it's an endurance event","Relax in the rack between reps"],
   mistakes:["Starting too fast and fading","Gripping the handle hard on every rep","Arms doing the work in the jerk"]},
  cs:{name:"Long cycle (dlouhý cyklus – přemístění a jerk)",muscles:"Celé tělo",
   about:"Přemístění a jerk v každém opakování — jedna z hlavních disciplín kettlebellového sportu. V soutěži je to 10minutová série na co nejvíc opakování bez položení kettlebellu; s jedním kettlebellem je povolená jen jedna výměna ruky.",
   steps:["Přemísti kettlebell do racku.","Jerkem ho dostaň nad hlavu (první podřep, odraz, druhý podřep, fixace).","Spusť ho zpět do racku a pak do zášvihu.","Znovu přemísti a opakuj — najdi rytmus, který udržíš."],
   cues:["Rozvrhni si síly — je to vytrvalostní disciplína","Mezi opakováními se v racku uvolni"],
   mistakes:["Příliš rychlý začátek a pak odpadnutí","Silné mačkání madla při každém opakování","V jerku pracují ruce"]}},
 {id:"kb-snatch",cat:"cond",equip:"kb",level:2,kb:true,src:["kwSnatch","cwSnatch","wikiGS"],
  en:{name:"Kettlebell Snatch",muscles:"Glutes, hamstrings, back, shoulders, grip",
   about:"One uninterrupted movement from the backswing to overhead lockout. A main kettlebell-sport lift (one bell, 10-minute set in competition).",
   steps:["Start with a one-arm swing backswing.","Drive the hips forward; keep the bell travelling up close to the body, not in a wide arc.","As the bell becomes weightless around chest height, punch the hand up through the handle so the bell rolls softly around the wrist.","Finish with the arm locked overhead, bell resting on the back of the forearm.","Drop it back down and into the next backswing."],
   cues:["One smooth movement — not a clean and press","Loose grip at the top, punch through"],
   mistakes:["Bell crashing onto the wrist (hand too late or grip too tight)","Not fully locking out overhead","Snatching before the swing, clean and press are solid"]},
  cs:{name:"Trh kettlebellem (snatch)",muscles:"Hýždě, hamstringy, záda, ramena, úchop",
   about:"Jeden plynulý pohyb ze zášvihu do zamčené pozice nad hlavou. Hlavní disciplína kettlebellového sportu (jeden kettlebell, v soutěži 10minutová série).",
   steps:["Začni zášvihem jako u jednoručního swingu.","Vytlač boky dopředu; kettlebell veď nahoru blízko těla, ne v širokém oblouku.","Když kettlebell kolem výšky hrudníku „ztratí váhu“, prostrč ruku nahoru skrz madlo, aby se kettlebell měkce převalil kolem zápěstí.","Skonči se zamčenou paží nad hlavou, kettlebell leží na zadní straně předloktí.","Spusť ho dolů do dalšího zášvihu."],
   cues:["Jeden plynulý pohyb — ne přemístění a tlak","Nahoře volný úchop a prostrčení ruky"],
   mistakes:["Kettlebell dopadá na zápěstí (ruka pozdě nebo moc pevný úchop)","Nedotažené zamčení nad hlavou","Trh dřív, než zvládáš swing, přemístění a tlak"]}},
 {id:"tgu",cat:"core",equip:"kb",level:1,kb:true,src:["aceTGU","nscaTGU"],
  en:{name:"Turkish Get-Up",muscles:"Shoulders, core, hips — whole body",
   about:"Getting from lying on the floor to standing — and back down — while holding a kettlebell locked out overhead. Slow and controlled; a strong shoulder-stability and coordination exercise.",
   steps:["Lie on your back with the bell pressed up in one hand (say right). Bend the right knee, right foot flat; left arm and leg out at about 45°.","Roll onto the left elbow, then push up onto the left hand.","Lift the hips into a bridge.","Sweep the left leg back under you into a kneeling position.","Lift the left hand off the floor and come up to tall kneeling.","Stand up. Then reverse every step to get back down."],
   cues:["Arm locked, eyes on the bell (until you're standing)","Each position should be stable before you move on"],
   mistakes:["Bending the elbow of the bell arm","Rushing through the steps","Going heavy before the pattern is solid — learn it with a shoe or no weight first"]},
  cs:{name:"Turecký vztyk (Turkish get-up)",muscles:"Ramena, střed těla, kyčle — celé tělo",
   about:"Přechod z lehu na zemi do stoje — a zpět — s kettlebellem v propnuté paži nad sebou. Pomalý a kontrolovaný; výborný na stabilitu ramene a koordinaci.",
   steps:["Lehni si na záda s kettlebellem vytlačeným nahoru v jedné ruce (např. pravé). Pravé koleno pokrčené, chodidlo na zemi; levá paže a noha zhruba 45° od těla.","Převal se na levý loket, pak se vytlač na levou dlaň.","Zvedni boky do mostu.","Protáhni levou nohu dozadu pod sebe do kleku.","Zvedni levou ruku ze země a narovnej se do vysokého kleku.","Postav se. Pak všechny kroky zopakuj pozpátku zpět na zem."],
   cues:["Paže zamčená, oči na kettlebellu (dokud nestojíš)","Každá pozice musí být stabilní, než pokračuješ"],
   mistakes:["Pokrčený loket paže s kettlebellem","Spěchání mezi kroky","Těžká váha dřív, než umíš pohyb — nauč se ho nejdřív s botou nebo bez zátěže"]}},
 {id:"windmill",cat:"core",equip:"kb",level:2,kb:true,src:["cpWind"],
  en:{name:"Kettlebell Windmill",muscles:"Obliques, hips, hamstrings, shoulder stability",
   about:"With a kettlebell locked out overhead, hinge sideways to reach the opposite foot. Builds core and shoulder stability; needs good hip and hamstring mobility.",
   steps:["Wide stance, bell locked out overhead in one hand.","Turn the foot on the free-hand side out; the other foot points forward (or slightly in).","Push the hip on the bell side out and hinge, sliding the free hand down the inside of the leg toward the turned-out foot.","Keep the bell arm vertical and your eyes on the bell.","Stand back up slowly by driving the hips."],
   cues:["It's a hip hinge sideways, not a side bend","Bell arm stays vertical the whole time"],
   mistakes:["Bending the bell arm","Rounding the back to reach lower","Going further than your hips allow"]},
  cs:{name:"Větrný mlýn s kettlebellem (windmill)",muscles:"Šikmé svaly, kyčle, hamstringy, stabilita ramene",
   about:"S kettlebellem zamčeným nad hlavou se předkloníš do strany k opačné noze. Buduje stabilitu středu těla a ramene; potřebuje dobrou pohyblivost kyčlí a hamstringů.",
   steps:["Široký postoj, kettlebell zamčený nad hlavou v jedné ruce.","Chodidlo na straně volné ruky vytoč ven; druhé míří dopředu (nebo mírně dovnitř).","Vysuň bok na straně kettlebellu do strany a předkloň se, volnou ruku sunut po vnitřní straně nohy k vytočenému chodidlu.","Paže s kettlebellem zůstává svisle, oči sledují kettlebell.","Pomalu se vrať vytlačením boků."],
   cues:["Je to předklon v kyčlích do strany, ne úklon","Paže s kettlebellem celou dobu svisle"],
   mistakes:["Pokrčená paže s kettlebellem","Kulacení zad, abys došel níž","Hlouběji, než kyčle dovolí"]}},
 {id:"halo",cat:"push",equip:"kb",level:0,kb:true,src:["slHalo","pelHalo"],
  en:{name:"Kettlebell Halo",muscles:"Shoulders, upper back, core",
   about:"Circling a kettlebell slowly around the head. Often used in warm-ups for shoulder mobility and core control.",
   steps:["Hold the bell upside down by the horns in front of the chest.","Brace the core and keep the elbows fairly close.","Circle the bell around the head, keeping it close — behind the head at about neck level.","Return to the front and change direction each rep or each set."],
   cues:["Slow and controlled","Keep the circle tight around the head"],
   mistakes:["Huge circles","Swaying or arching the torso","Going too heavy"]},
  cs:{name:"Halo s kettlebellem",muscles:"Ramena, horní záda, střed těla",
   about:"Pomalé kroužení kettlebellem kolem hlavy. Často součást rozcvičky pro pohyblivost ramen a kontrolu středu těla.",
   steps:["Drž kettlebell dnem vzhůru za rohy madla před hrudníkem.","Zpevni trup, lokty drž spíš u sebe.","Krouž kettlebellem kolem hlavy blízko ní — za hlavou zhruba ve výšce krku.","Vrať se dopředu a měň směr každé opakování nebo sérii."],
   cues:["Pomalu a kontrolovaně","Kruh těsně kolem hlavy"],
   mistakes:["Obrovské kruhy","Kývání nebo prohýbání trupu","Příliš velká váha"]}},
 {id:"gorilla-row",cat:"pull",equip:"kb2",level:1,kb:true,src:["ltGorilla","gsGorilla"],
  en:{name:"Gorilla Row",muscles:"Lats, mid/upper back, biceps, core",
   about:"An alternating bent-over row with two kettlebells on the floor between your feet. One hand pushes a bell into the floor while the other rows.",
   steps:["Wide stance, two kettlebells between the feet. Hinge down with a flat back and grab both handles.","Push one bell into the floor and brace.","Row the other bell until the elbow is by your ribs, then lower it to the floor.","Alternate sides. Hips and torso stay at the same height."],
   cues:["Push one, pull the other","Elbow toward the hip, close to the body"],
   mistakes:["Hips rising as you get tired","Twisting to heave the bell up","Rounded back"]},
  cs:{name:"Gorilí přítahy (gorilla row)",muscles:"Široký sval zádový, střední a horní záda, bicepsy, střed těla",
   about:"Střídavé přítahy v předklonu se dvěma kettlebelly na zemi mezi chodidly. Jedna ruka tlačí kettlebell do země, druhá přitahuje.",
   steps:["Široký postoj, dva kettlebelly mezi chodidly. Předkloň se s rovnými zády a chyť obě madla.","Jeden kettlebell zatlač do země a zpevni se.","Druhý přitáhni, až je loket u žeber, a polož ho zpět na zem.","Střídej strany. Boky i trup zůstávají ve stejné výšce."],
   cues:["Jeden tlač, druhý táhni","Loket k boku, blízko těla"],
   mistakes:["Boky se s únavou zvedají","Vytáčení trupu, abys kettlebell vyhodil","Kulatá záda"]}},
 {id:"kb-front-squat",cat:"legs",equip:"kb",level:1,kb:true,
  en:{name:"Kettlebell Front Squat",muscles:"Quads, glutes, upper back, core",
   about:"A squat with one or two kettlebells in the rack position. Harder on the upper back and core than a goblet squat.",
   steps:["Clean the bell(s) to the rack. Elbows tucked, wrists neutral.","Feet about shoulder width.","Squat down keeping the chest up and the bells tight to the body.","Stand up and stay tall at the top."],
   cues:["Elbows in, chest up","Bells stay glued to the body"],
   mistakes:["Elbows flaring so the bells pull you forward","Upper back rounding"]},
  cs:{name:"Čelní dřep s kettlebellem",muscles:"Kvadricepsy, hýždě, horní záda, střed těla",
   about:"Dřep s jedním nebo dvěma kettlebelly v racku. Náročnější na horní záda a střed těla než goblet dřep.",
   steps:["Přemísti kettlebell(y) do racku. Lokty u těla, zápěstí rovně.","Chodidla zhruba na šířku ramen.","Jdi do dřepu, hrudník nahoře, kettlebelly přitisknuté k tělu.","Vstaň a nahoře zůstaň vzpřímený."],
   cues:["Lokty k sobě, hrudník nahoru","Kettlebelly přilepené k tělu"],
   mistakes:["Lokty ujíždějí do stran a kettlebelly tě táhnou dopředu","Kulatá horní záda"]}},
 {id:"kb-jump-squat",cat:"legs",equip:"kb",level:1,kb:true,
  en:{name:"Kettlebell Jump Squat",muscles:"Quads, glutes, calves",
   about:"A squat jump holding a kettlebell — usually goblet-style at the chest, or hanging between the legs. Trains leg power.",
   steps:["Hold the bell at the chest (or by the handle between the legs).","Squat to a comfortable depth.","Jump explosively, keeping the bell close.","Land softly and go straight into the next squat."],
   cues:["Land quietly","Use a light bell — speed matters more than weight"],
   mistakes:["Too heavy, so the jump turns into a calf raise","Knees caving on landing"]},
  cs:{name:"Výskoky z dřepu s kettlebellem",muscles:"Kvadricepsy, hýždě, lýtka",
   about:"Výskok z dřepu s kettlebellem — obvykle drženým u hrudníku jako u goblet dřepu, nebo visícím mezi nohama. Trénuje výbušnost nohou.",
   steps:["Drž kettlebell u hrudníku (nebo za madlo mezi nohama).","Jdi do dřepu do pohodlné hloubky.","Výbušně vyskoč, kettlebell drž blízko těla.","Měkce dopadni a plynule pokračuj do dalšího dřepu."],
   cues:["Dopad potichu","Lehký kettlebell — rychlost je důležitější než váha"],
   mistakes:["Moc těžký kettlebell, ze skoku je jen výpon","Kolena padají při dopadu dovnitř"]}},

 {id:"air-squat",cat:"legs",equip:"bw",level:0,

   about:"A bodyweight squat — the base pattern for every squatting movement in CrossFit.",
   steps:["Feet about shoulder width, toes slightly out.","Push the hips back and down, arms reaching forward for balance.","Go until the hip crease is below the top of the knee.","Stand all the way up, hips and knees fully open."],
   cues:["Weight across the whole foot","Knees follow the toes"],
   mistakes:["Not deep enough","Not standing fully at the top","Heels lifting"]},
  cs:{name:"Dřep s vlastní vahou (air squat)",muscles:"Kvadricepsy, hýždě",
   about:"Dřep bez zátěže — základní vzor pro všechny dřepové cviky v CrossFitu.",
   steps:["Chodidla zhruba na šířku ramen, špičky mírně ven.","Posílej boky dozadu a dolů, ruce natahuj dopředu kvůli rovnováze.","Jdi dolů, až je kyčelní ohyb pod horní hranou kolen.","Postav se úplně, boky i kolena plně propnuté."],
   cues:["Váha na celém chodidle","Kolena ve směru špiček"],
   mistakes:["Nedostatečná hloubka","Nedotažený stoj nahoře","Zvedání pat"]}},
 {id:"sit-up",cat:"core",equip:"abmat",level:0,
  en:{name:"Sit-up (AbMat)",muscles:"Abs, hip flexors",
   about:"The CrossFit sit-up, usually done with an AbMat under the lower back and the soles of the feet together.",
   steps:["Lie back with an AbMat under the lower back, soles of the feet together, knees out.","Touch the floor behind your head with your hands.","Sit up and touch your feet (or the floor in front of them).","Lie back down under control."],
   cues:["Use the arms to swing through","Keep a steady rhythm"],
   mistakes:["Not touching the floor behind the head","Yanking on the neck"]},
  cs:{name:"Sed-leh (sit-up s AbMatem)",muscles:"Břišní svaly, flexory kyčle",
   about:"Sed-leh v podání CrossFitu, obvykle s podložkou AbMat pod bedry a chodidly u sebe.",
   steps:["Lehni si s AbMatem pod bedry, chodidla chodidly k sobě, kolena od sebe.","Rukama se dotkni země za hlavou.","Posaď se a dotkni se chodidel (nebo země před nimi).","Kontrolovaně si lehni zpět."],
   cues:["Pomoz si švihem paží","Udržuj stálý rytmus"],
   mistakes:["Ruce se nedotknou země za hlavou","Tahání za krk"]}},
 {id:"single-under",cat:"cond",equip:"rope",level:0,
  en:{name:"Single-under (Jump Rope)",muscles:"Calves, coordination",
   about:"Regular rope skipping — the rope passes under the feet once per jump. Learn this well before double-unders.",
   steps:["Rope length: standing on the middle, the handles reach roughly to the armpits.","Elbows close to the body, hands at hip height.","Turn the rope with the wrists and make small jumps on the balls of the feet."],
   cues:["Small jumps, quiet feet","Wrists, not arms"],
   mistakes:["Jumping too high","Big arm circles","Rope much too long or short"]},
  cs:{name:"Přeskoky přes švihadlo (single-under)",muscles:"Lýtka, koordinace",
   about:"Klasické skákání přes švihadlo — švihadlo projde pod nohama jednou za výskok. Nauč se je dobře před dvojšvihy.",
   steps:["Délka švihadla: když stojíš na jeho středu, rukojeti sahají zhruba do podpaží.","Lokty u těla, ruce ve výšce boků.","Toč švihadlem zápěstími a dělej malé výskoky na přední části chodidel."],
   cues:["Malé výskoky, tichý dopad","Zápěstí, ne paže"],
   mistakes:["Příliš vysoké výskoky","Velké kroužení pažemi","Švihadlo výrazně moc dlouhé nebo krátké"]}},
 {id:"ski-erg",cat:"cond",equip:"skierg",level:0,src:["c2Ski","c2SkiCrunch"],
  en:{name:"SkiErg",muscles:"Lats, triceps, core, legs",
   about:"A cardio machine that copies the double-pole motion of cross-country skiing. Most of the power comes from a crunch of the core plus the lats — not from the arms alone.",
   steps:["Stand with feet about shoulder width, hands slightly above the head, arms bent.","Drive the handles down by crunching the core and bending the knees. Keep the arms bent so the handles stay close to the face.","Finish with knees slightly bent and arms extended down beside the thighs.","Stand up and reach the arms back up to the start."],
   cues:["Crunch, don't bow — lead with the chest, not by folding at the hips","Keep a bend in the arms ('climb the rope')"],
   mistakes:["Arms straight the whole time","Only pulling with the arms","Deep squat on every pull"]},
  cs:{name:"SkiErg (lyžařský trenažér)",muscles:"Široký sval zádový, tricepsy, střed těla, nohy",
   about:"Kardio stroj, který napodobuje soupaž z běžeckého lyžování. Většina síly jde ze stažení břicha a širokých zádových svalů — ne jen z paží.",
   steps:["Stůj s chodidly zhruba na šířku ramen, ruce mírně nad hlavou, paže pokrčené.","Stáhni madla dolů zkrácením břicha a pokrčením kolen. Paže drž pokrčené, aby madla šla blízko obličeje.","Skonči s lehce pokrčenými koleny a pažemi nataženými dolů podél stehen.","Narovnej se a vrať paže nahoru do výchozí polohy."],
   cues:["Stáhni břicho, nekláněj se v bocích — veď hrudníkem","Paže stále mírně pokrčené („šplh po laně“)"],
   mistakes:["Paže celou dobu propnuté","Tah jen rukama","Hluboký dřep při každém tahu"]}},
 {id:"toes-to-bar",cat:"core",equip:"bar",level:2,src:["cfT2B","cfT2Bguide"],
  en:{name:"Toes-to-Bar (T2B)",muscles:"Abs, hip flexors, lats, grip",
   about:"Hanging from a pull-up bar and bringing both feet up to touch the bar. In CrossFit usually done with a kip — a rhythmic swing between a 'hollow' and an 'arch' position.",
   steps:["Hang with hands about shoulder width, arms straight, shoulders active.","Arch: chest forward through the arms, feet slightly behind you.","Hollow: push the bar down with straight arms, body slightly rounded, ribs down, feet in front.","From the hollow, pull the knees toward the chest and kick the toes to the bar.","Let the legs come down quickly back into the arch, and go straight into the next rep."],
   cues:["Push the bar down with the arms in the hollow","Long body, legs together, straight legs in the backswing"],
   mistakes:["Swinging with loose shoulders","Bending the arms","Not resetting the arch between reps"],
   scale:"Easier: kip swings, hanging knee raises, or strict knee-to-elbows."},
  cs:{name:"Toes-to-bar (špičky k hrazdě)",muscles:"Břišní svaly, flexory kyčle, široký sval zádový, úchop",
   about:"Ve visu na hrazdě dostaneš obě chodidla až k hrazdě. V CrossFitu obvykle s kippingem — rytmickým houpáním mezi pozicí „hollow“ (prohnutí dopředu, kulatý trup) a „arch“ (prohnutí dozadu).",
   steps:["Vis s rukama zhruba na šířku ramen, paže propnuté, ramena aktivní.","Arch: hrudník projde mezi pažemi dopředu, nohy lehce za tebou.","Hollow: propnutými pažemi tlač hrazdu dolů, tělo mírně zakulacené, žebra dolů, nohy před tebou.","Z pozice hollow přitáhni kolena k hrudníku a vykopni špičky k hrazdě.","Nohy rychle spusť zpět do archu a plynule navaž další opakování."],
   cues:["V hollow tlač hrazdu pažemi dolů","Dlouhé tělo, nohy u sebe, při zášvihu propnuté"],
   mistakes:["Houpání s povolenými rameny","Pokrčování paží","Mezi opakováními se nevrátíš do archu"],
   scale:"Lehčí: houpání (kip swing), přitahování kolen ve visu nebo striktní kolena k loktům."}},
 {id:"rope-climb",cat:"pull",equip:"climbrope",level:2,src:["mcuRope","fvRope"],
  en:{name:"Rope Climb",muscles:"Lats, biceps, grip, core, legs",
   about:"Climbing a hanging rope. Using a foot lock (most commonly the J-hook) lets the legs do most of the work so the grip lasts longer.",
   steps:["Reach high and grab the rope, one hand above the other.","Lift the knees. Let the rope hang down the outside of one foot.","With the other foot, sweep under the rope and bring it up over the top of the first foot — the rope forms a J. Clamp it between the feet.","Stand up on the clamped rope, reach the hands higher, then lift the knees and re-lock the feet. Repeat.","Come down hand under hand, loosening the feet a little — never slide down."],
   cues:["Legs climb, arms hold","Knees high before each lock"],
   mistakes:["Climbing with arms only","Sliding down (rope burns)","Lace-up shoes catching the rope — long socks or shin guards help"],
   scale:"Easier: lying-to-standing rope pulls, or practise the foot lock while seated on a box."},
  cs:{name:"Šplh na laně",muscles:"Široký sval zádový, bicepsy, úchop, střed těla, nohy",
   about:"Šplhání po visícím laně. Zámek nohou (nejčastěji J-hook) nechá většinu práce na nohou, takže úchop vydrží déle.",
   steps:["Chyť lano vysoko, jedna ruka nad druhou.","Zvedni kolena. Lano nech viset po vnější straně jednoho chodidla.","Druhým chodidlem podeber lano zespodu a přetáhni ho přes nárt prvního chodidla — lano udělá tvar J. Sevři ho mezi chodidly.","Postav se na sevřené lano, přehmátni výš, pak zvedni kolena a znovu zamkni nohy. Opakuj.","Dolů slézej ručkováním a mírně povol nohy — nikdy nesjížděj."],
   cues:["Šplhají nohy, ruce drží","Před každým zámkem kolena vysoko"],
   mistakes:["Šplh jen rukama","Sjíždění dolů (spáleniny od lana)","Tkaničky se zachytávají o lano — pomůžou vysoké ponožky nebo chrániče holení"],
   scale:"Lehčí: přítahy z lehu do stoje za lano, nebo trénink zámku nohou vsedě na bedně."}},
 {id:"wall-walk",cat:"push",equip:"wall",level:1,src:["cfWallWalk","brWallWalk"],
  en:{name:"Wall Walk",muscles:"Shoulders, triceps, core",
   about:"From lying face down, walk your feet up a wall and your hands back toward it into a handstand, then walk back down. A basic tool for learning to be upside down.",
   steps:["Lie on your stomach with your feet touching the wall.","Push up to a plank and place your feet on the wall.","Walk the feet up the wall while walking the hands back toward it, in small steps.","Go until your hands reach the target (often a tape line) — close to the wall in the full version.","Walk back out the same way until you're lying down again. That's one rep."],
   cues:["Core tight — ribs down, no banana back","Small hand steps"],
   mistakes:["Arching the lower back","Rushing the way down","Looking at the floor in front of you"],
   scale:"Easier: walk only part-way up (e.g. to a closer tape line), or do inchworms / plank holds with the feet on a box."},
  cs:{name:"Wall walk (chůze po zdi)",muscles:"Ramena, tricepsy, střed těla",
   about:"Z lehu na břiše vyjdeš nohama po zdi a rukama ke zdi do stojky, pak zpět dolů. Základní nástroj, jak se naučit být hlavou dolů.",
   steps:["Lehni si na břicho, chodidla se dotýkají zdi.","Vytlač se do planku a polož chodidla na zeď.","Malými kroky jdi nohama po zdi nahoru a rukama ke zdi.","Pokračuj, až ruce dojdou k cíli (často čára z pásky) — v plné verzi těsně ke zdi.","Stejně se vrať zpět, až zase ležíš. To je jedno opakování."],
   cues:["Zpevněný trup — žebra dolů, žádná prohnutá záda","Malé kroky rukama"],
   mistakes:["Prohnutá bedra","Spěchání při cestě dolů","Pohled do země před sebe"],
   scale:"Lehčí: jen část cesty (bližší čára), nebo housenka / plank s nohama na bedně."}},
 {id:"sdhp",cat:"cond",equip:"kbbb",level:1,kb:true,src:["cfSDHP"],
  en:{name:"Sumo Deadlift High Pull (SDHP)",muscles:"Glutes, hamstrings, quads, traps, shoulders",
   about:"A wide-stance deadlift that flows into a pull of the weight up to the chin. One of CrossFit's nine foundational movements, done with a kettlebell or barbell. Fast cycle time makes it a strong conditioning tool.",
   steps:["Wide stance, toes out, knees over the toes. Grip the kettlebell (or bar) with hands close together.","Hips tall, chest up, back flat.","Drive with the legs and open the hips fully.","Only once the hips are open, shrug and pull with the elbows high, bringing the weight to just under the chin.","Lower in reverse: arms first, then hips and knees."],
   cues:["Hips first, arms last","Elbows high and outside the hands"],
   mistakes:["Pulling with the arms before the hips have finished","Knees caving in","Rounding the back on the way down"]},
  cs:{name:"Sumo mrtvý tah s přítahem k bradě (SDHP)",muscles:"Hýždě, hamstringy, kvadricepsy, trapézy, ramena",
   about:"Mrtvý tah v širokém postoji, který plynule přejde v přítah závaží k bradě. Jeden z devíti základních pohybů CrossFitu, s kettlebellem nebo osou. Díky rychlému cyklu je to silný kondiční cvik.",
   steps:["Široký postoj, špičky ven, kolena nad špičkami. Chyť kettlebell (nebo osu) rukama blízko u sebe.","Boky vysoko, hrudník nahoru, záda rovná.","Odtlač se nohama a plně propni boky.","Až když jsou boky propnuté, pokrč ramena a přitáhni s lokty vysoko — závaží těsně pod bradu.","Spouštěj v opačném pořadí: nejdřív paže, pak boky a kolena."],
   cues:["Nejdřív boky, ruce až nakonec","Lokty vysoko a vně rukou"],
   mistakes:["Tah rukama dřív, než boky dokončí","Kolena padají dovnitř","Kulacení zad při spouštění"]}},
 {id:"half-snatch",cat:"cond",equip:"kb",level:2,kb:true,src:["sfHalf","wikiGS"],
  en:{name:"Kettlebell Half Snatch",muscles:"Glutes, hamstrings, back, shoulders, grip",
   about:"The way up is the same as a snatch, but on the way down the bell drops to the rack first, then from the rack into the backswing. Easier to learn than the full snatch and a training lift in its own right; also used in kettlebell-sport long-distance events.",
   steps:["Swing the bell back between the legs and drive the hips forward.","Punch the hand through the handle and lock out overhead, as in the snatch.","Lower the bell from overhead to the rack position.","From the rack, drop it into the backswing and go straight into the next rep."],
   cues:["Up like a snatch, down like a clean","Keep the bell close on the way up"],
   mistakes:["Pressing out the top instead of punching through","Bell banging the forearm on the way up"]},
  cs:{name:"Poloviční trh kettlebellem (half snatch)",muscles:"Hýždě, hamstringy, záda, ramena, úchop",
   about:"Cesta nahoru je stejná jako u trhu, ale dolů kettlebell nejdřív spadne do racku a teprve z racku do zášvihu. Snazší na naučení než plný trh a samostatný tréninkový cvik; používá se i v dlouhých disciplínách kettlebellového sportu.",
   steps:["Podej kettlebell dozadu mezi nohy a vytlač boky dopředu.","Prostrč ruku madlem a zamkni nad hlavou, stejně jako u trhu.","Spusť kettlebell z pozice nad hlavou do racku.","Z racku ho nech spadnout do zášvihu a plynule pokračuj dalším opakováním."],
   cues:["Nahoru jako trh, dolů jako přemístění","Na cestě nahoru kettlebell blízko těla"],
   mistakes:["Dotlačování nahoře místo prostrčení ruky","Kettlebell tluče na cestě nahoru do předloktí"]}},
 {id:"devil-press",cat:"cond",equip:"db2kb",level:2,kb:true,src:["rogueDevil","repDevil"],
  en:{name:"Devil Press",muscles:"Whole body",
   about:"A burpee with hands on two dumbbells (or kettlebells), followed by swinging both weights from the floor to overhead in one movement — a double snatch.",
   steps:["Stand over two dumbbells. Squat down and put your hands on them.","Jump the feet back and lower the chest to the floor.","Push up and jump the feet back in, landing with hips back, ready to hinge.","Swing the weights back between the legs and drive the hips to snatch both overhead in one smooth motion.","Lock out with arms straight overhead, then lower the weights back to the floor."],
   cues:["It's a hinge — hips throw the weights","Arms straight up overhead, not out to the sides"],
   mistakes:["Pulling the weights up with the arms","Rounding the back when picking them off the floor","Dropping the weights from overhead without control"],
   scale:"Easier: one dumbbell, lighter weights, or burpee + push press. With kettlebells, keep the bells outside the hands in the push-up so the wrists stay straight."},
  cs:{name:"Devil press",muscles:"Celé tělo",
   about:"Angličák s rukama na dvou jednoručkách (nebo kettlebellech), po kterém obě závaží jedním pohybem vyšvihneš ze země nad hlavu — dvojitý trh.",
   steps:["Stoupni si nad dvě jednoručky. Podřepni a polož na ně ruce.","Odskoč nohama dozadu a polož hrudník na zem.","Vytlač se a přiskoč nohama zpět, dopadni s boky vzadu, připravený na předklon v kyčlích.","Podej závaží dozadu mezi nohy a vytlačením boků je obě plynule vyšvihni nad hlavu.","Zamkni paže nad hlavou, pak závaží spusť zpět na zem."],
   cues:["Je to předklon v kyčlích — závaží vyhodí boky","Paže nad hlavou rovně nahoru, ne do stran"],
   mistakes:["Tahání závaží rukama","Kulatá záda při zvedání ze země","Nekontrolované pouštění závaží z pozice nad hlavou"],
   scale:"Lehčí: jedna jednoručka, lehčí váha, nebo angličák + push press. S kettlebelly je při kliku drž vně dlaní, aby zápěstí zůstala rovná."}},
 {id:"renegade-row",cat:"pull",equip:"db2kb",level:1,kb:true,src:["bmRenegade"],
  en:{name:"Renegade Row",muscles:"Lats, upper back, core, shoulders",
   about:"A row from a push-up plank, holding two kettlebells or dumbbells. As much a core exercise as a back exercise: the job is not to rotate.",
   steps:["Plank position with hands on two bells under the shoulders, feet wider than hips for stability.","Brace and push one bell into the floor.","Row the other bell to the ribs while keeping the hips and shoulders square to the floor.","Lower it under control and switch sides."],
   cues:["Hips stay level — imagine a glass of water on your lower back","Wide feet make it easier"],
   mistakes:["Twisting the torso to lift the weight","Hips sagging or piking","Bells rolling — use hex dumbbells or flat-based kettlebells"]},
  cs:{name:"Renegade row (přítahy v planku)",muscles:"Široký sval zádový, horní záda, střed těla, ramena",
   about:"Přítahy z pozice planku na dvou kettlebellech nebo jednoručkách. Stejně tak cvik na střed těla jako na záda: úkolem je nevytočit se.",
   steps:["Plank s rukama na dvou závažích pod rameny, chodidla šířeji než boky kvůli stabilitě.","Zpevni se a jedno závaží zatlač do země.","Druhé přitáhni k žebrům, boky i ramena zůstávají rovnoběžně se zemí.","Kontrolovaně ho polož a vyměň strany."],
   cues:["Boky v rovině — představ si sklenici vody na bedrech","Širší postoj chodidel to usnadní"],
   mistakes:["Vytáčení trupu, aby šlo závaží nahoru","Prověšené nebo vystrčené boky","Kutálející se závaží — použij šestihranné jednoručky nebo kettlebelly s plochým dnem"]}},
 {id:"bottoms-up",cat:"push",equip:"kb",level:2,kb:true,src:["bmBottoms"],
  en:{name:"Bottoms-Up Kettlebell Press",muscles:"Shoulders, rotator cuff, grip, core",
   about:"A press with the kettlebell held upside down by the handle, bell pointing up. The instability forces strict technique and a hard grip; good for shoulder stability.",
   steps:["Clean or set the bell into the bottoms-up position: forearm vertical, bell balanced above the fist.","Grip the handle hard and brace the whole body.","Press slowly overhead, keeping the bell upright.","Lower under control. Keep the free hand near your face in case the bell tips."],
   cues:["Crush the handle","Slow and straight"],
   mistakes:["Loose grip, so the bell flops over","Wrist bent","Going heavy too soon — use a much lighter bell than for a normal press"]},
  cs:{name:"Tlak kettlebellu dnem vzhůru (bottoms-up)",muscles:"Ramena, rotátorová manžeta, úchop, střed těla",
   about:"Tlak s kettlebellem drženým za madlo dnem vzhůru, koule míří nahoru. Nestabilita vynutí přesnou techniku a pevný úchop; výborné pro stabilitu ramene.",
   steps:["Přemísti nebo nastav kettlebell dnem vzhůru: předloktí svisle, koule balancuje nad pěstí.","Pevně stiskni madlo a zpevni celé tělo.","Pomalu tlač nad hlavu a drž kettlebell svisle.","Kontrolovaně spouštěj. Volnou ruku měj u obličeje, kdyby se kettlebell převrátil."],
   cues:["Drť madlo","Pomalu a rovně"],
   mistakes:["Volný úchop — kettlebell se překlopí","Zalomené zápěstí","Moc brzy těžká váha — použij mnohem lehčí kettlebell než na běžný tlak"]}},
 {id:"kb-carries",cat:"cond",equip:"kb",level:0,kb:true,
  en:{name:"Kettlebell Carries (rack, overhead, suitcase)",muscles:"Core, shoulders, grip, upper back",
   about:"Walking while holding kettlebells in different positions. Each version challenges the body differently: suitcase (one bell at the side) fights side-bending, rack loads the core and upper back, overhead (waiter walk) works shoulder stability.",
   steps:["Pick the bell(s) up with good deadlift or clean technique.","Suitcase: one bell at your side, stand tall without leaning. Rack: bell(s) in the rack position. Overhead: arm locked out, biceps by the ear.","Walk with short, steady steps for the set distance or time, then switch sides."],
   cues:["Stand tall — don't lean away from the bell","Ribs down, breathe"],
   mistakes:["Leaning to one side","Bent arm overhead","Rushing the steps"]},
  cs:{name:"Nošení kettlebellů (rack, nad hlavou, kufr)",muscles:"Střed těla, ramena, úchop, horní záda",
   about:"Chůze s kettlebelly v různých pozicích. Každá verze zatěžuje tělo jinak: kufr (jeden kettlebell u boku) brání úklonu, rack zatěžuje střed těla a horní záda, nad hlavou (waiter walk) trénuje stabilitu ramene.",
   steps:["Zvedni kettlebell(y) správnou technikou mrtvého tahu nebo přemístění.","Kufr: jeden kettlebell u boku, stůj rovně bez úklonu. Rack: kettlebell(y) v racku. Nad hlavou: paže zamčená, biceps u ucha.","Jdi krátkými rovnoměrnými kroky na danou vzdálenost nebo čas, pak vyměň strany."],
   cues:["Stůj rovně — nenaklánej se od kettlebellu","Žebra dolů, dýchej"],
   mistakes:["Úklon do strany","Pokrčená paže nad hlavou","Spěchání"]}},
 {id:"kb-sl-rdl",cat:"legs",equip:"kb",level:1,kb:true,
  en:{name:"Single-Leg Kettlebell RDL",muscles:"Hamstrings, glutes, balance",
   about:"A Romanian deadlift on one leg, holding a kettlebell. Trains each side separately and challenges balance and hip control.",
   steps:["Hold the bell in the hand opposite the standing leg (or in both hands).","Soft knee on the standing leg. Hinge forward while the free leg reaches straight back.","Keep the hips square to the floor; go until you feel the hamstring stretch.","Drive the standing hip forward to stand up tall."],
   cues:["Body moves like a seesaw — head and back heel in a line","Hips square, toes of the back foot pointing down"],
   mistakes:["Opening the hip so the back leg turns out","Rounding the back","Squatting down instead of hinging"]},
  cs:{name:"Jednonožný rumunský mrtvý tah s kettlebellem",muscles:"Hamstringy, hýždě, rovnováha",

   steps:["Drž kettlebell v ruce na opačné straně, než je stojná noha (nebo oběma rukama).","Stojná noha s lehce pokrčeným kolenem. Předkloň se a volnou nohu natahuj rovně dozadu.","Boky zůstávají rovnoběžně se zemí; jdi, dokud necítíš protažení hamstringu.","Vytlač bok stojné nohy dopředu a postav se vzpřímeně."],

   mistakes:["Otevírání kyčle, zadní noha se vytáčí ven","Kulatá záda","Dřep místo předklonu v kyčlích"]}},
 {id:"kb-racked-lunge",cat:"legs",equip:"kb",level:1,kb:true,

   steps:["Přemísti kettlebell(y) do racku. Stůj vzpřímeně.","Ustup jednou nohou dozadu a spouštěj se, až je zadní koleno těsně nad zemí.","Odraz se přes přední chodidlo zpět do stoje.","Střídej nohy nebo udělej všechna opakování na jedné straně."],
   cues:["Přední holeň zhruba svisle","Trup vzpřímený, lokty u těla"],

];

/* ============================================================
   TERMS — en + cs
   ============================================================ */
const TERMS = [
 {abbr:"AMRAP",cat:"format",src:["cfTerms"],
  en:{name:"As Many Rounds (or Reps) As Possible",def:"Do as many rounds or reps of a set workout as you can within a fixed time. Score is total rounds + extra reps.",ex:"12-min AMRAP:\n10 kettlebell swings\n10 box jumps\n10 push-ups\n→ Score: e.g. 6 rounds + 14 reps"},
  cs:{name:"Co nejvíc kol (nebo opakování)",def:"Za pevně daný čas uděláš co nejvíc kol nebo opakování zadaného tréninku. Výsledek = počet kol + opakování navíc.",ex:"AMRAP 12 min:\n10× kettlebell swing\n10× výskok na bednu\n10× klik\n→ Výsledek: např. 6 kol + 14 opakování"}},
 {abbr:"EMOM",cat:"format",src:["cfTerms"],
  en:{name:"Every Minute On the Minute",def:"At the start of every minute you do a set amount of work; whatever time is left in that minute is rest. Variants: E2MOM (every 2 minutes) etc.",ex:"10-min EMOM:\n5 pull-ups + 10 air squats\n→ Finish in 35 s, rest 25 s."},
  cs:{name:"Každou minutu na začátku minuty",def:"Na začátku každé minuty uděláš zadanou práci; zbytek minuty je pauza. Varianty: E2MOM (každé 2 minuty) apod.",ex:"EMOM 10 min:\n5 shybů + 10 dřepů\n→ Hotovo za 35 s, pauza 25 s."}},
 {abbr:"For Time",cat:"format",
  en:{name:"For Time / RFT (Rounds For Time)",def:"Complete a set amount of work as fast as possible. Score is the finishing time. Often has a time cap.",ex:"3 rounds for time:\n400 m run\n21 kettlebell swings\n12 pull-ups"},
  cs:{name:"Na čas / RFT (kola na čas)",def:"Zadanou práci uděláš co nejrychleji. Výsledek je čas. Často má časový limit.",ex:"3 kola na čas:\n400 m běh\n21× kettlebell swing\n12 shybů"}},
 {abbr:"Tabata",cat:"format",src:["cfTerms","tabataRits","tabataRev"],
  en:{name:"Tabata intervals",def:"8 rounds of 20 s work / 10 s rest — 4 minutes total. In the original 1996 study (Izumi Tabata, speed skaters) it was done all-out on a bike at very high intensity; today the name is used for any 20/10 interval workout. In CrossFit the score is often the lowest number of reps in any round.",ex:"Tabata air squats: 8 × (20 s work / 10 s rest)"},
  cs:{name:"Tabata intervaly",def:"8 kol po 20 s práce / 10 s pauzy — celkem 4 minuty. V původní studii z roku 1996 (Izumi Tabata, rychlobruslaři) šlo o maximální úsilí na kole ve velmi vysoké intenzitě; dnes se tak říká jakémukoli intervalu 20/10. V CrossFitu bývá výsledkem nejnižší počet opakování v jednom kole.",ex:"Tabata dřepy: 8 × (20 s práce / 10 s pauza)"}},
 {abbr:"Chipper",cat:"format",
  en:{name:"Chipper",def:"A long workout with many different exercises, each done once in order — you 'chip away' at the list.",ex:"50 wall balls, 40 box jumps, 30 KB swings, 20 burpees, 10 pull-ups"},
  cs:{name:"Chipper",def:"Dlouhý trénink s mnoha různými cviky, každý se udělá jednou v daném pořadí — seznam postupně „ukrajuješ“.",ex:"50 wall ballů, 40 výskoků na bednu, 30 swingů, 20 angličáků, 10 shybů"}},
 {abbr:"Ladder",cat:"format",
  en:{name:"Ladder",def:"Reps go up (or down) each round, e.g. 1, 2, 3, 4… Can be ascending, descending, or both."},
  cs:{name:"Žebřík",def:"Počet opakování se každé kolo zvyšuje (nebo snižuje), např. 1, 2, 3, 4… Může být vzestupný, sestupný nebo obojí."}},
 {abbr:"Death by…",cat:"format",
  en:{name:"Death by",def:"An EMOM where reps increase by one each minute (1 in minute 1, 2 in minute 2…) until you can't finish them within the minute."},
  cs:{name:"Death by",def:"EMOM, kde každou minutu přibude jedno opakování (1 v první minutě, 2 ve druhé…), dokud to v rámci minuty nestihneš."}},
 {abbr:"Circuit",cat:"format",
  en:{name:"Circuit training",def:"Several exercises done back-to-back with little rest, then repeated for a number of rounds."},
  cs:{name:"Kruhový trénink",def:"Několik cviků za sebou s minimální pauzou, celé se to opakuje v několika kolech."}},
 {abbr:"WOD",cat:"format",src:["cfTerms"],
  en:{name:"Workout Of the Day",def:"The prescribed workout for a given day — a CrossFit term."},
  cs:{name:"Trénink dne",def:"Předepsaný trénink pro daný den — pojem z CrossFitu."}},
 {abbr:"Metcon",cat:"format",
  en:{name:"Metabolic conditioning",def:"A workout aimed at conditioning — usually moderate-to-high intensity with short rests, e.g. AMRAPs and For Time workouts."},
  cs:{name:"Metabolická kondice",def:"Trénink zaměřený na kondici — obvykle střední až vysoká intenzita s krátkými pauzami, např. AMRAP nebo trénink na čas."}},
 {abbr:"HIIT",cat:"format",
  en:{name:"High-Intensity Interval Training",def:"Alternating short bursts of hard work with periods of rest or easy work."},
  cs:{name:"Vysoce intenzivní intervalový trénink",def:"Střídání krátkých úseků tvrdé práce s pauzou nebo lehkou aktivitou."}},
 {abbr:"LISS",cat:"format",
  en:{name:"Low-Intensity Steady State",def:"Long, easy, continuous cardio — e.g. 40 minutes of walking, cycling or rowing at a conversational pace."},
  cs:{name:"Nízká intenzita, stálé tempo",def:"Dlouhé, lehké, souvislé kardio — např. 40 minut chůze, kola nebo veslování v tempu, kdy se dá mluvit."}},
 {abbr:"Zone 2",cat:"format",src:["zone2"],
  en:{name:"Heart-rate Zone 2",def:"Easy aerobic intensity, generally defined by experts as just below the first lactate (or ventilatory) threshold — you can still hold a conversation. There's no single agreed definition: watches and apps use different zone models, so the heart-rate numbers differ between them."},
  cs:{name:"Zóna 2",def:"Lehká aerobní intenzita, odborníky obvykle definovaná jako těsně pod prvním laktátovým (nebo ventilačním) prahem — ještě se dá mluvit. Jednotná definice neexistuje: hodinky a aplikace používají různé modely zón, takže čísla tepové frekvence se mezi nimi liší."}},
 {abbr:"Time cap",cat:"format",
  en:{name:"Time cap (TC)",def:"Maximum time allowed for a For Time workout. If you don't finish, you're scored on the reps you completed."},
  cs:{name:"Časový limit (TC)",def:"Maximální čas pro trénink na čas. Když nedokončíš, počítají se hotová opakování."}},
 {abbr:"Buy-in / Cash-out",cat:"format",
  en:{name:"Buy-in / Cash-out",def:"A buy-in is work you must do before the main workout starts; a cash-out is done right after it ends."},
  cs:{name:"Buy-in / Cash-out",def:"Buy-in je práce, kterou musíš udělat před hlavním tréninkem; cash-out se dělá hned po něm."}},

 {abbr:"Rep",cat:"sets",
  en:{name:"Repetition",def:"One complete movement of an exercise."},
  cs:{name:"Opakování",def:"Jeden celý pohyb cviku."}},
 {abbr:"Set",cat:"sets",
  en:{name:"Set",def:"A group of consecutive reps. \"3×10\" means 3 sets of 10 reps."},
  cs:{name:"Série",def:"Skupina opakování za sebou. „3×10“ znamená 3 série po 10 opakováních."}},
 {abbr:"Superset",cat:"sets",
  en:{name:"Superset",def:"Two exercises done back-to-back with no rest between them, then rest. Often opposing muscles (e.g. bench press + row).",ex:"A1: Bench press × 8\nA2: Cable row × 10\nRest 90 s, repeat"},
  cs:{name:"Supersérie",def:"Dva cviky hned po sobě bez pauzy, pak odpočinek. Často protilehlé svaly (např. bench press + přítahy).",ex:"A1: Bench press × 8\nA2: Přítahy kladky × 10\nPauza 90 s, opakovat"}},
 {abbr:"Giant set",cat:"sets",
  en:{name:"Giant set",def:"Three or more exercises done back-to-back without rest."},
  cs:{name:"Obří série",def:"Tři a více cviků za sebou bez pauzy."}},
 {abbr:"Drop set",cat:"sets",src:["rpDrop","nasmDrop"],
  en:{name:"Drop set",def:"Do a set close to failure, immediately reduce the weight (about 20% is a common default; 10–30% is typical) and keep going without rest. Usually 2–3 drops."},
  cs:{name:"Drop set (sestupná série)",def:"Série téměř do selhání, pak hned snížíš váhu (běžně asi o 20 %, obvykle 10–30 %) a bez pauzy pokračuješ. Obvykle 2–3 snížení."}},
 {abbr:"Rest-pause",cat:"sets",
  en:{name:"Rest-pause set",def:"Do a set close to failure, rest 10–20 seconds, then do a few more reps with the same weight. Repeat 1–3 times."},
  cs:{name:"Rest-pause",def:"Série téměř do selhání, 10–20 s pauza a pak ještě pár opakování se stejnou váhou. Opakuj 1–3×."}},
 {abbr:"Cluster set",cat:"sets",
  en:{name:"Cluster set",def:"A set broken into small chunks with short rests (10–30 s) between them, allowing heavier weight or more total reps."},
  cs:{name:"Clusterová série",def:"Série rozdělená na malé části s krátkými pauzami (10–30 s), což umožní větší váhu nebo víc opakování celkem."}},
 {abbr:"Unbroken",cat:"sets",
  en:{name:"Unbroken",def:"Doing all reps of a set without putting the weight down or stopping."},
  cs:{name:"Bez přerušení",def:"Všechna opakování série bez položení závaží nebo zastavení."}},
 {abbr:"Warm-up sets",cat:"sets",
  en:{name:"Warm-up / ramp-up sets",def:"Lighter sets before the working sets, gradually increasing the weight to prepare the body."},
  cs:{name:"Rozcvičovací série",def:"Lehčí série před pracovními, váha se postupně zvyšuje, aby se tělo připravilo."}},
 {abbr:"Working sets",cat:"sets",
  en:{name:"Working sets",def:"The sets at your target weight and effort — the ones that count."},
  cs:{name:"Pracovní série",def:"Série v cílové váze a úsilí — ty, které se počítají."}},

 {abbr:"1RM",cat:"intensity",
  en:{name:"One-Rep Max (RM)",def:"The heaviest weight you can lift for one full rep with good form. 5RM = heaviest weight for 5 reps. Programs often prescribe weights as % of 1RM.",ex:"5 × 5 @ 75% 1RM — if your 1RM is 100 kg, use 75 kg"},
  cs:{name:"Maximum na jedno opakování (RM)",def:"Nejtěžší váha, kterou zvedneš na jedno celé opakování v dobré technice. 5RM = nejtěžší váha na 5 opakování. Plány často zadávají váhu v % z 1RM.",ex:"5 × 5 @ 75 % 1RM — když máš 1RM 100 kg, použij 75 kg"}},
 {abbr:"RPE",cat:"intensity",src:["helmsRIR","zourdos"],
  en:{name:"Rate of Perceived Exertion",def:"In lifting, a 1–10 scale tied to reps in reserve: RPE 10 = maximal effort, nothing left; RPE 9 = 1 rep left; RPE 8 = 2 reps left. Accuracy improves with experience and is better close to failure.",ex:"3 × 8 @ RPE 8 → choose a weight where you'd have ~2 reps left"},
  cs:{name:"Vnímaná námaha",def:"V posilování škála 1–10 navázaná na opakování v rezervě: RPE 10 = maximální úsilí, nic nezbývá; RPE 9 = zbývá 1 opakování; RPE 8 = zbývají 2. Přesnost roste se zkušenostmi a je lepší blízko selhání.",ex:"3 × 8 @ RPE 8 → zvol váhu, kdy by ti zbývala ~2 opakování"}},
 {abbr:"RIR",cat:"intensity",src:["helmsRIR"],
  en:{name:"Reps In Reserve",def:"How many more reps you could have done at the end of a set. 2 RIR ≈ RPE 8."},
  cs:{name:"Opakování v rezervě",def:"Kolik opakování bys ještě zvládl na konci série. 2 RIR ≈ RPE 8."}},
 {abbr:"Failure",cat:"intensity",
  en:{name:"Training to failure",def:"Continuing a set until you can't complete another rep with good form."},
  cs:{name:"Do selhání",def:"Série až do chvíle, kdy už nezvládneš další opakování v dobré technice."}},
 {abbr:"PR / PB",cat:"intensity",
  en:{name:"Personal Record / Personal Best",def:"Your best-ever result in a lift or workout."},
  cs:{name:"Osobní rekord",def:"Tvůj nejlepší výsledek v cviku nebo tréninku."}},
 {abbr:"Rx / Scaled",cat:"intensity",
  en:{name:"As prescribed / Scaled",def:"Rx = doing the workout exactly as written (weights, movements). Scaled = modified to suit your level, e.g. lighter weight or easier movement."},
  cs:{name:"Podle předpisu / Upraveno",def:"Rx = trénink přesně podle zadání (váhy, cviky). Scaled = upravený pro tvou úroveň, např. lehčí váha nebo snazší cvik."}},

 {abbr:"Tempo",cat:"technique",src:["nasmTempo"],
  en:{name:"Tempo notation (e.g. 3-1-1-0)",def:"Four numbers giving seconds for: lowering (eccentric) – pause at the bottom – lifting (concentric) – pause at the top. 'X' = as fast as possible. For lifts that start with the lifting phase (deadlift, pull-up) you start reading at the third number.",ex:"Squat @ 3-1-X-0:\n3 s down, 1 s pause at the bottom, explode up, no pause at the top"},
  cs:{name:"Zápis tempa (např. 3-1-1-0)",def:"Čtyři čísla udávají sekundy pro: spouštění (excentrická fáze) – pauza dole – zvedání (koncentrická fáze) – pauza nahoře. „X“ = co nejrychleji. U cviků, které začínají zvedáním (mrtvý tah, shyb), začínáš číst třetím číslem.",ex:"Dřep @ 3-1-X-0:\n3 s dolů, 1 s pauza dole, výbušně nahoru, nahoře bez pauzy"}},
 {abbr:"TUT",cat:"technique",
  en:{name:"Time Under Tension",def:"Total time a muscle is working during a set."},
  cs:{name:"Čas pod napětím",def:"Celkový čas, kdy sval během série pracuje."}},
 {abbr:"Eccentric",cat:"technique",
  en:{name:"Eccentric phase",def:"The lowering part of a lift, where the muscle lengthens under load (e.g. going down into a squat)."},
  cs:{name:"Excentrická fáze",def:"Brzdivá část pohybu, kdy se sval pod zátěží prodlužuje (např. spouštění do dřepu)."}},
 {abbr:"Concentric",cat:"technique",
  en:{name:"Concentric phase",def:"The lifting part of a lift, where the muscle shortens (e.g. standing up from a squat)."},
  cs:{name:"Koncentrická fáze",def:"Zvedací část pohybu, kdy se sval zkracuje (např. vstávání z dřepu)."}},
 {abbr:"Isometric",cat:"technique",
  en:{name:"Isometric",def:"Muscle working without the joint moving, e.g. a plank or a paused hold."},
  cs:{name:"Izometrie",def:"Sval pracuje bez pohybu v kloubu, např. prkno nebo výdrž."}},
 {abbr:"Negative",cat:"technique",
  en:{name:"Negative",def:"Doing only the lowering phase slowly, e.g. jumping to the top of a pull-up and lowering for 5 s."},
  cs:{name:"Negativ",def:"Jen pomalá brzdivá fáze, např. vyskočíš do horní pozice shybu a 5 s se spouštíš."}},
 {abbr:"ROM",cat:"technique",
  en:{name:"Range Of Motion",def:"How far a joint moves during an exercise. 'Full ROM' = through the complete movement."},
  cs:{name:"Rozsah pohybu",def:"Jak velký pohyb kloub během cviku udělá. „Plný ROM“ = celý rozsah."}},
 {abbr:"Kipping",cat:"technique",
  en:{name:"Kipping",def:"Using a hip swing to generate momentum in gymnastic movements like pull-ups. Allows more reps; 'strict' = no swing."},
  cs:{name:"Kipping",def:"Využití švihu z boků v gymnastických cvicích, např. shybech. Umožní víc opakování; „strict“ = bez švihu."}},
 {abbr:"Grip",cat:"technique",
  en:{name:"Grip types",def:"Pronated = overhand (palms away). Supinated = underhand (palms toward you). Neutral = palms facing each other. Mixed = one of each (used in deadlifts)."},
  cs:{name:"Typy úchopu",def:"Nadhmat = dlaně od tebe. Podhmat = dlaně k tobě. Neutrální = dlaně proti sobě. Obouchop (smíšený) = jedna ruka nadhmatem, druhá podhmatem (u mrtvého tahu)."}},
 {abbr:"Brace",cat:"technique",
  en:{name:"Bracing",def:"Taking a big breath into the belly and tightening the core all around before a heavy rep, to keep the spine stable."},
  cs:{name:"Zpevnění trupu",def:"Velký nádech do břicha a zpevnění celého trupu dokola před těžkým opakováním, aby páteř zůstala stabilní."}},
 {abbr:"Compound",cat:"technique",
  en:{name:"Compound vs. isolation",def:"Compound exercises use several joints and muscle groups (squat, row). Isolation exercises target one joint or muscle (biceps curl, lateral raise)."},
  cs:{name:"Vícekloubové vs. izolované cviky",def:"Vícekloubové cviky zapojují víc kloubů a svalových skupin (dřep, přítahy). Izolované cílí na jeden kloub nebo sval (bicepsový zdvih, upažování)."}},

 {abbr:"Volume",cat:"programming",
  en:{name:"Training volume",def:"Total work done — usually sets × reps × weight, or the number of hard sets per muscle per week."},
  cs:{name:"Tréninkový objem",def:"Celkové množství práce — obvykle série × opakování × váha, nebo počet těžkých sérií na sval za týden."}},
 {abbr:"Progressive overload",cat:"programming",
  en:{name:"Progressive overload",def:"Gradually increasing the demand over time — more weight, more reps, more sets, or better quality — so the body keeps adapting."},
  cs:{name:"Progresivní přetížení",def:"Postupné zvyšování nároků — víc váhy, opakování, sérií nebo lepší kvalita — aby se tělo dál adaptovalo."}},
 {abbr:"Deload",cat:"programming",
  en:{name:"Deload",def:"A planned lighter week (less weight or volume) to recover before continuing to progress."},
  cs:{name:"Odlehčovací týden (deload)",def:"Plánovaný lehčí týden (méně váhy nebo objemu) na zotavení, než se pokračuje v progresi."}},
 {abbr:"Hypertrophy",cat:"programming",
  en:{name:"Hypertrophy",def:"Muscle growth. Hypertrophy training typically uses moderate weights and moderate-to-high reps taken close to failure."},
  cs:{name:"Hypertrofie",def:"Růst svalů. Trénink na hypertrofii obvykle používá střední váhy a střední až vyšší počet opakování blízko selhání."}},
 {abbr:"Periodization",cat:"programming",
  en:{name:"Periodization",def:"Planning training in phases (e.g. volume phase, strength phase, peak) over weeks or months."},
  cs:{name:"Periodizace",def:"Plánování tréninku ve fázích (např. objemová, silová, vrchol) v horizontu týdnů nebo měsíců."}},
 {abbr:"Split",cat:"programming",
  en:{name:"Training split",def:"How you divide training across the week — e.g. full body, upper/lower, push/pull/legs (PPL)."},
  cs:{name:"Tréninkový split",def:"Jak rozdělíš trénink během týdne — např. celé tělo, horní/dolní polovina, tlaky/tahy/nohy (PPL)."}},
 {abbr:"DOMS",cat:"programming",src:["doms"],
  en:{name:"Delayed Onset Muscle Soreness",def:"Muscle soreness after unfamiliar or hard training. It usually builds over the first day and peaks around 24–72 hours afterwards. Sharp or unusual pain is not DOMS."},
  cs:{name:"Opožděná svalová bolest (svalovice)",def:"Bolest svalů po neobvyklém nebo tvrdém tréninku. Obvykle narůstá první den a vrcholí zhruba 24–72 hodin po tréninku. Ostrá nebo neobvyklá bolest není svalovice."}},

 {abbr:"Rack",cat:"kb",src:["kwClean","hkKB"],
  en:{name:"Rack position",def:"The kettlebell resting at the chest after a clean: wrist neutral, elbow close to the ribs, bell supported by the forearm and upper arm, torso tall. The start position for presses, jerks and front squats."},
  cs:{name:"Rack (pozice u hrudníku)",def:"Kettlebell spočívá u hrudníku po přemístění: zápěstí rovné, loket u žeber, kettlebell opřený o předloktí a paži, trup vzpřímený. Výchozí pozice pro tlaky, jerky a čelní dřepy."}},
 {abbr:"Hardstyle",cat:"kb",src:["wikiKB"],
  en:{name:"Hardstyle vs. sport style",def:"Two schools of kettlebell technique. Hardstyle (e.g. StrongFirst, RKC) uses a strong hip hinge and maximal tension for power and strength. Sport style (kettlebell sport / girevoy) is built for efficiency over long sets, with more knee bend and relaxed arms."},
