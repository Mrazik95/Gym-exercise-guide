const EX_CATS=["kb","legs","push","pull","arms","core","cond"], TERM_CATS=["abbr","format","sets","intensity","technique","programming","kb"];
const inCat=(e,c)=>c==="all"||(c==="kb"?!!e.kb:e.cat===c);

/* ============================================================ */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let lang = store.get("gg-lang","en");
let favs = new Set(store.get("gg-favs",[]));
let state = {tab:"ex", cat:"all", q:""};
let current=null;
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = o=>o[lang]||o.en;
const t = ()=>T[lang];
const exKey=e=>"e:"+e.id, termKey=x=>"t:"+x.abbr;
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const match=txt=>norm(txt).includes(norm(state.q));
const exText=e=>[e.en.name,e.cs.name,e.en.muscles,e.cs.muscles,t().equip[e.equip]].join(" ");
const termText=x=>[x.abbr,x.en.name,x.cs.name,L(x).def].join(" ");
const checkedCount=EXERCISES.filter(e=>e.src).length+TERMS.filter(x=>x.src).length;

function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  document.querySelectorAll("nav.tabs button").forEach(b=>{b.textContent=t().tabs[b.dataset.tab];b.classList.toggle("on",b.dataset.tab===state.tab)});
  $("#back").textContent=t().back;
  $("#pageTitle").textContent=t().tabs[state.tab];
  $("#q").style.display=state.tab==="about"?"none":"";
  $("#q").placeholder=t().search[state.tab]||"";
  const list=$("#list"), chips=$("#chips");
  chips.innerHTML=""; list.innerHTML="";
  if(state.tab==="about"){ list.innerHTML=`<div class="about">${t().about(EXERCISES.length,TERMS.length,checkedCount)}</div>`; return; }
  const cats = state.tab==="ex"?EX_CATS: state.tab==="terms"?TERM_CATS:null;
  if(cats) chips.innerHTML=["all",...cats].map(c=>`<button class="chip ${c===state.cat?"on":""}" data-cat="${c}">${esc(c==="all"?t().all:t().cats[c])}</button>`).join("");
  let items=[];
  if(state.tab==="ex") items=EXERCISES.filter(e=>inCat(e,state.cat)&&match(exText(e))).map(exCard);
  else if(state.tab==="terms") items=TERMS.filter(x=>(state.cat==="all"||x.cat===state.cat)&&match(termText(x))).map(termCard);
  else {
    items=[...EXERCISES.filter(e=>favs.has(exKey(e))&&match(exText(e))).map(exCard),
           ...TERMS.filter(x=>favs.has(termKey(x))&&match(termText(x))).map(termCard)];
    if(!items.length && !state.q){list.innerHTML=`<div class="empty">${t().noSaved}</div>`;return;}
  }
  list.innerHTML = items.length?items.join(""):`<div class="empty">${t().empty}</div>`;
}
function exCard(e){const d=L(e);
  return `<button class="card" data-ex="${e.id}"><div class="main"><div class="name">${esc(d.name)}</div>
  <div class="sub">${esc(d.muscles)}</div></div>${e.src?`<span class="badge ok" title="${t().checked}">✓</span>`:""}</button>`;}
function termCard(x){const d=L(x);
  return `<button class="card" data-term="${esc(x.abbr)}"><span class="abbr">${esc(x.abbr)}</span>
  <div class="main"><div class="name">${esc(d.name)}</div>${x.cat==="abbr"?"":`<div class="sub">${esc(d.def)}</div>`}</div></button>`;}
const yt=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
function srcHTML(keys){
  if(!keys) return `<p class="note">${t().unchecked}</p>`;
  return `<div class="sec src"><h3>${t().sources}</h3><ul>${keys.map(k=>`<li><a href="${esc(S[k][1])}" target="_blank" rel="noopener">${esc(S[k][0])}</a></li>`).join("")}</ul></div>`;
}
function openDetail(kind,item,push=true){
  current={kind,item};
  const key=kind==="ex"?exKey(item):termKey(item);
  const star=$("#dStar"); star.textContent=favs.has(key)?"★":"☆"; star.classList.toggle("on",favs.has(key));
  const d=L(item), other=item[lang==="cs"?"en":"cs"];
  let h="";
  if(kind==="ex"){
    h+=`<h2>${esc(d.name)}</h2><p class="alt">${esc(other.name)}</p><div class="meta"><span class="badge">${esc(t().cats[item.cat])}</span>${item.kb&&item.equip!=="kb"?`<span class="badge">Kettlebell</span>`:""}<span class="badge">${esc(t().equip[item.equip])}</span><span class="badge">${esc(t().levels[item.level])}</span>${item.src?`<span class="badge ok">✓ ${t().checked}</span>`:""}</div>`;
    h+=`<p class="lead">${esc(d.about)}</p>`;
    h+=`<div class="sec"><h3>${t().muscles}</h3>${esc(d.muscles)}</div>`;
    h+=`<div class="sec"><h3>${t().how}</h3><ol>${d.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`;
    if(d.cues) h+=`<div class="sec"><h3>${t().cues}</h3><ul>${d.cues.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`;
    if(d.mistakes) h+=`<div class="sec warn"><h3>${t().mistakes}</h3><ul>${d.mistakes.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`;
    if(d.scale) h+=`<div class="sec"><h3>${t().scale}</h3>${esc(d.scale)}</div>`;
    h+=`<div class="sec"><h3>${t().video}</h3>`;
    if(item.video) h+=`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${esc(item.video)}" allowfullscreen loading="lazy" title="${esc(d.name)}"></iframe></div>`;
    h+=`<a class="btn" href="${yt(item.en.name+" proper form technique")}" target="_blank" rel="noopener">${t().vidTech}</a>`;
    h+=`<a class="btn ghost" href="${yt(item.en.name+" common mistakes")}" target="_blank" rel="noopener">${t().vidMist}</a></div>`;
    h+=srcHTML(item.src);
  } else {
    h+=`<h2>${esc(item.abbr)}</h2><div class="meta"><span class="badge">${esc(t().cats[item.cat])}</span>${item.src?`<span class="badge ok">✓ ${t().checked}</span>`:""}</div>`;
    h+=`<p class="lead"><strong>${esc(d.name)}</strong>${other.name!==d.name?`<br><span class="alt">${esc(other.name)}</span>`:""}</p>`;
    if(item.cat!=="abbr") h+=`<div class="sec"><h3>${t().meaning}</h3>${esc(d.def)}</div>`;
    if(d.ex) h+=`<div class="sec"><h3>${t().example}</h3><div class="example">${esc(d.ex)}</div></div>`;
    const rel=TERMS.filter(x=>x.cat===item.cat&&x!==item).slice(0,8);
    if(rel.length) h+=`<div class="sec"><h3>${t().related}</h3><div class="related">${rel.map(r=>`<button data-term="${esc(r.abbr)}">${esc(r.abbr)}</button>`).join("")}</div></div>`;
    h+=`<a class="btn ghost" href="${yt(item.en.name+" explained workout")}" target="_blank" rel="noopener">${t().vidTerm}</a><div style="height:12px"></div>`;
    h+=srcHTML(item.src);
  }
  $("#dBody").innerHTML=h;
  const el=$("#detail"); el.classList.add("open"); el.setAttribute("aria-hidden","false"); el.scrollTop=0;
  $("#dShare").textContent=t().share;
  const url=location.pathname+location.search+"#"+slugOf(kind,item);
  try{ if(push) history.pushState({d:1},"",url); else history.replaceState({d:(history.state&&history.state.d)||0},"",url); }catch(e){}
}
function closeDetail(){ const el=$("#detail"); el.classList.remove("open"); el.setAttribute("aria-hidden","true"); current=null;
  if(location.hash){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}} render(); }
function slugOf(kind,item){ return kind==="ex"?item.id:"t-"+item.abbr.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function fromHash(){
  const h=decodeURIComponent(location.hash.slice(1)); if(!h) return null;
  const e=EXERCISES.find(x=>x.id===h); if(e) return ["ex",e];
  const tm=TERMS.find(x=>slugOf("term",x)===h); if(tm) return ["term",tm];
  return null;
}
let toastTimer;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2500); }

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-tab],[data-cat],[data-ex],[data-term],[data-lang]");
  if(!b) return;
  if(b.dataset.lang){lang=b.dataset.lang;store.set("gg-lang",lang);render();if(current)openDetail(current.kind,current.item,false);}
  else if(b.dataset.tab){state.tab=b.dataset.tab;state.cat="all";state.q="";$("#q").value="";if(current)closeDetail();render();window.scrollTo(0,0);}
  else if(b.dataset.cat){state.cat=b.dataset.cat;render();}
  else if(b.dataset.ex){openDetail("ex",EXERCISES.find(e=>e.id===b.dataset.ex),!current);}
  else if(b.dataset.term){openDetail("term",TERMS.find(x=>x.abbr===b.dataset.term),!current);}
});
$("#q").addEventListener("input",e=>{state.q=e.target.value;render();});
$("#back").addEventListener("click",()=>{ if(history.state&&history.state.d){try{history.back();return}catch(e){}} closeDetail(); });
window.addEventListener("popstate",()=>{ const f=fromHash(); if(f) openDetail(f[0],f[1],false); else if(current) closeDetail(); });
$("#dShare").addEventListener("click",async()=>{
  if(!current) return;
  const link=location.href.split("#")[0]+"#"+slugOf(current.kind,current.item);
  const title=current.kind==="ex"?L(current.item).name:current.item.abbr;
  try{ if(navigator.share){ await navigator.share({title:"Gym Guide – "+title,url:link}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(link); toast(t().copied); }catch(e){ toast(link); }
});
$("#dStar").addEventListener("click",()=>{
  if(!current) return;
  const key=current.kind==="ex"?exKey(current.item):termKey(current.item);
  favs.has(key)?favs.delete(key):favs.add(key);
  store.set("gg-favs",[...favs]);
  $("#dStar").textContent=favs.has(key)?"★":"☆"; $("#dStar").classList.toggle("on",favs.has(key));
});
if("serviceWorker" in navigator && location.protocol==="https:" && !/claude/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();
